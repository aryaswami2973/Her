<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahak ❤️ Arya</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
text-align:center;
background:linear-gradient(135deg,#ff9a9e,#fecfef);
overflow-x:hidden;
}

.section{
display:none;
padding:20px;
}

.active{
display:block;
}

button{
padding:12px 22px;
font-size:16px;
border:none;
border-radius:25px;
margin:10px;
cursor:pointer;
}

.primary{
background:white;
color:#ff4e88;
}

.dark{
background:black;
color:white;
}

img{
width:170px;
border-radius:15px;
margin:10px;
}

.hidden-btn{
position:absolute;
opacity:0.1;
}

.big{
transform:scale(1.4);
}

.fade{
animation:fadeIn 1s ease-in-out;
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}
</style>
</head>

<body>

<!-- STAGE 1 -->
<div id="stage1" class="section active">
<h1>Mahak ❤️ Arya</h1>
<p>Welcome to our little world 💕</p>
<button class="primary" onclick="next(1)">Enter</button>
</div>

<!-- STAGE 2 -->
<div id="stage2" class="section">
<h2>Memory Hunt 🕵️‍♀️</h2>
<p>Find and tap 3 hidden hearts to unlock next surprise 😌</p>

<img src="photo1.jpg">
<img src="photo2.jpg">

<button class="hidden-btn" style="top:200px;left:30px;" onclick="foundHeart()"></button>
<button class="hidden-btn" style="top:350px;right:40px;" onclick="foundHeart()"></button>
<button class="hidden-btn" style="top:500px;left:150px;" onclick="foundHeart()"></button>

<p id="heartCount">Hearts found: 0 / 3</p>
</div>

<!-- STAGE 3 -->
<div id="stage3" class="section">
<h2>Serious Question 😏</h2>
<p>Will you always choose me?</p>
<button id="yesBtn" class="primary" onclick="yesClick()">Yes 💖</button>
<button id="noBtn" class="dark" onclick="noClick()">No 😜</button>
</div>

<!-- STAGE 4 -->
<div id="stage4" class="section">
<h2>Last Surprise 🎁</h2>
<p>You reached here... which means destiny is working 😉</p>
<button class="primary" onclick="finalStage()">Open Final Surprise</button>
</div>

<!-- STAGE 5 -->
<div id="stage5" class="section">
<h1>Mahak ❤️</h1>
<h2>Will you be mine forever? 💍</h2>
<button class="primary big" onclick="celebrate()">Yes, Always 💖</button>
</div>

<script>
let heartCounter=0;

function next(stage){
document.getElementById("stage"+stage).classList.remove("active");
document.getElementById("stage"+(stage+1)).classList.add("active");
}

function foundHeart(){
heartCounter++;
document.getElementById("heartCount").innerText="Hearts found: "+heartCounter+" / 3";
if(heartCounter>=3){
setTimeout(()=>next(2),1000);
}
}

function yesClick(){
next(3);
}

function noClick(){
let yes=document.getElementById("yesBtn");
yes.classList.add("big");
alert("Are you sure? Think again 😌");
}

function finalStage(){
next(4);
}

function celebrate(){
alert("Forever starts now ❤️ I love you Mahak!");
document.body.style.background="linear-gradient(135deg,#ff758c,#ff7eb3)";
}
</script>

</body>
</html>
