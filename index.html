<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahak ❤️ Arya</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #ff9a9e, #fecfef);
    overflow-x: hidden;
}

.container {
    padding: 20px;
}

h1 {
    margin-top: 20px;
}

p {
    font-size: 18px;
}

.gallery img {
    width: 180px;
    margin: 10px;
    border-radius: 12px;
}

button {
    padding: 10px 20px;
    font-size: 16px;
    margin: 10px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
}

#yesBtn {
    background: white;
    color: #ff4e88;
}

#noBtn {
    background: black;
    color: white;
    position: absolute;
}

#proposal {
    display: none;
    margin-top: 30px;
}
</style>
</head>

<body>

<div class="container">

<h1>Mahak ❤️ Arya</h1>

<p>
You are my happiness, my peace, and my forever.
</p>

<div class="gallery">
    <img src="photo1.jpg" alt="Us 1">
    <img src="photo2.jpg" alt="Us 2">
</div>

<button onclick="showProposal()">Tap for Surprise 💌</button>

<div id="proposal">
    <h2>Will you be mine forever? ❤️</h2>
    <button id="yesBtn" onclick="sayYes()">Yes 💖</button>
    <button id="noBtn" onmouseover="moveNo()">No 😜</button>
</div>

</div>

<script>
function showProposal() {
    document.getElementById("proposal").style.display = "block";
}

function sayYes() {
    alert("I love you Mahak ❤️ Forever starts now!");
}

function moveNo() {
    var button = document.getElementById("noBtn");
    var x = Math.random() * (window.innerWidth - 100);
    var y = Math.random() * (window.innerHeight - 100);
    button.style.left = x + "px";
    button.style.top = y + "px";
}
</script>

</body>
</html>
